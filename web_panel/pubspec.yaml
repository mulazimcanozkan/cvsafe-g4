name: cvsafe_web_panel
description: CVSAFE web panel - site safety management for OHS specialists and administrators.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cvsafe_core:
    path: ../packages/cvsafe_core
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  http: ^1.2.1
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
